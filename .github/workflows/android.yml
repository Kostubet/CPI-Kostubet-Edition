name: Android CI/CD

on:
  push:
    branches: [main, beta, dev]
    tags: ['v*-build*']
  pull_request:
    branches: [main, beta, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      apk: ${{ steps.package.outputs.apk }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
      - name: Verify release source
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The release tag must point to a commit on main."
            exit 1
          fi
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_type == 'tag' }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platforms;android-35 build-tools;34.0.0'
      - name: Run Gradle checks
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-checks
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
          retention-days: 7
      - name: Name the APK
        id: package
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          build=app/build/outputs/apk/release
          version="$(jq -er '.elements[0] | "\(.versionName)-build\(.versionCode)"' "$build/output-metadata.json")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-build[0-9]+$ ]]; then
            echo "::error::Invalid APK version in Gradle build metadata."
            exit 1
          fi
          case "$EVENT:$REF_TYPE:$REF_NAME" in
            pull_request:*) channel="pr-$PR_NUMBER" ;;
            *:tag:*) channel=release-candidate ;;
            *:branch:main) channel=main-candidate ;;
            *:branch:beta) channel=beta ;;
            *) channel=dev ;;
          esac
          name="CPI-Kostubet-Edition-$version-$channel-${GITHUB_SHA:0:7}"
          mkdir dist
          cp "$build/app-release.apk" "dist/$name.apk"
          cp "$build/output-metadata.json" dist/
          (cd dist && sha256sum "$name.apk" > "$name.apk.sha256")
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
          echo "apk=$name.apk" >> "$GITHUB_OUTPUT"
      - name: Upload APK and build metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Prepare signed release draft
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'build-tools;34.0.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: apk
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="$(jq -er '.elements[0] | "v\(.versionName)-build\(.versionCode)"' apk/output-metadata.json)"
          if [[ "$TAG" != "$expected" || ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-build[0-9]+$ ]]; then
            echo "::error::Expected tag $expected, got $TAG"
            exit 1
          fi
      - name: Sign and verify APK
        env:
          TAG: ${{ github.ref_name }}
          INPUT_APK: ${{ needs.verify.outputs.apk }}
          CPI_KEYSTORE: ${{ secrets.CPI_SIGNING_KEYSTORE }}
          CPI_STORE_PASSWORD: ${{ secrets.CPI_SIGNING_STORE_PASSWORD }}
          CPI_KEY_PASSWORD: ${{ secrets.CPI_SIGNING_KEY_PASSWORD }}
          CPI_KEY_ALIAS: ${{ vars.CPI_SIGNING_KEY_ALIAS }}
          CPI_CERT_SHA256: ${{ vars.CPI_SIGNING_CERT_SHA256 }}
        run: |
          : "${CPI_KEYSTORE:?Configure CPI_SIGNING_KEYSTORE}"
          : "${CPI_STORE_PASSWORD:?Configure CPI_SIGNING_STORE_PASSWORD}"
          : "${CPI_KEY_PASSWORD:?Configure CPI_SIGNING_KEY_PASSWORD}"
          : "${CPI_KEY_ALIAS:?Configure CPI_SIGNING_KEY_ALIAS}"
          : "${CPI_CERT_SHA256:?Configure CPI_SIGNING_CERT_SHA256}"
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          umask 077
          key="$(mktemp "$RUNNER_TEMP/cpi-keystore.XXXXXX")"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$CPI_KEYSTORE" | base64 --decode > "$key"

          mkdir -p dist
          apk="CPI-Kostubet-Edition-${TAG#v}.apk"
          "$signer" sign --ks "$key" --ks-key-alias "$CPI_KEY_ALIAS" \
            --ks-pass env:CPI_STORE_PASSWORD --key-pass env:CPI_KEY_PASSWORD \
            --out "dist/$apk" "apk/$INPUT_APK"
          certificate="$("$signer" verify --print-certs "dist/$apk" |
            awk -F ': ' '/certificate SHA-256 digest/ { print tolower($2); exit }')"
          if [[ "$certificate" != "${CPI_CERT_SHA256,,}" ]]; then
            echo "::error::APK signing certificate differs from the configured CPI certificate"
            exit 1
          fi
          (cd dist && sha256sum "$apk" > "$apk.sha256")
      - name: Prepare GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == false ]]; then
            echo "Release $TAG is already published."
            exit 0
          fi
          if [[ "$draft" != true ]]; then
            gh release create "$TAG" --verify-tag --draft --generate-notes \
              --title "CPI Kostubet Edition ${TAG#v}"
          fi
          gh release upload "$TAG" dist/*.apk dist/*.sha256 --clobber
