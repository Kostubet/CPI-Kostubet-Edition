[versions]
kotlin = "2.4.10"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version = "2026.08.00" }
coui-foundation = { module = "org.jetbrains.compose.foundation:foundation", version = "1.11.1" }
coui-lifecycle-runtime = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime", version = "2.11.0" }
coui-navigation-event = { module = "androidx.navigationevent:navigationevent-compose", version = "1.1.2" }
coui-compose-window-size = { module = "org.jetbrains.compose.material3:material3-window-size-class", version = "1.9.0" }
coui-material-kolor = { module = "com.materialkolor:material-color-utilities", version = "5.0.0" }

[plugins]
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
